  const m=$('#main');m.innerHTML='';const bk=$('#back');bk.style.display=view==='home'?'none':'';$('#prB').style.display=view==='home'?'none':'';
  bk.textContent=typeof view==='number'?'‹ '+CUR.title:(view==='akk'&&AKS)?'‹ Alle Lieder':(view==='blues'&&BLT===7&&BLS)?'‹ Alle Songs':'‹ Übersicht';
  if(view==='home'){$('#ttl').textContent='Piano Levels';
    m.append(html(`<div class="card"><h2>Schritt für Schritt Klavier lernen</h2><p class="muted" style="margin:0">Übe zuerst Puls und Rhythmus. Wähle dann ein Lied: Jedes Lied führt über seine Rhythmus-Bausteine bis zur gemeinsamen Akkordbegleitung.</p></div>`));
    m.append(html('<details class="card fold"><summary><h3>So funktioniert Piano Levels</h3></summary><p class="small" style="margin:0 0 .4rem">Du lernst Schritt für Schritt, ein Lied der Klasse zu spielen. Jedes Lied hat vier Level, die aufeinander aufbauen (bei Liedern mit Melodie kommt ein fünftes dazu):</p><ol class="small" style="margin:0 0 .5rem;padding-left:1.2rem"><li><b>Bausteine &amp; Rhythmus:</b> Du übst den Rhythmus des Lieds mit der <b>Rhythmussprache</b> (zum Beispiel «Schritt», «sta-ah», «Laufe») und tippst ihn im Takt mit. Das Level schliesst die App selbst ab.</li><li><b>Ein Ton:</b> Du spielst den Rhythmus auf einem einzigen Ton auf dem Piano.</li><li><b>Akkordtöne:</b> Die Klasse spielt in drei Gruppen den gleichen Rhythmus, jede Gruppe auf ihren eigenen Tönen.</li><li><b>Zusammen:</b> Alle Stimmen zusammen ergeben die Akkorde. Danach wird dazu gesungen.</li><li><b>Melodie</b> (nur bei Liedern mit Melodie): Du spielst die gesungene Melodie, die Begleitung läuft dazu.</li></ol><p class="small" style="margin:0 0 .4rem">Ab Level 2 bestätigt deine Lehrperson, dass du bereit bist, mit einem <b>Freigabewort</b>. Dann ist das nächste Level offen. Das Tempo startet beim Originaltempo des Lieds, du kannst es langsamer stellen. Die Metronom-Klicks helfen dir, den Puls zu halten. Alles wird auf deinem Gerät gespeichert. Die App lässt sich installieren und funktioniert auch ohne Internet.</p></details>'));
    m.append(html('<details class="card fold"><summary><h3>Was brauchst du?</h3></summary><p class="small" style="margin:0 0 .4rem">Die App zeigt Noten, Tasten und Rhythmen. Gespielt wird auf einem dieser Instrumente:</p><ul class="small" style="margin:0;padding-left:1.2rem"><li><b>Mini-Piano</b> (zum Beispiel Casio SA-46): Spiele die Töne auf dem Instrument und schau dazu in die App.</li><li><b>Richtiges Klavier oder Keyboard:</b> Funktioniert genauso, die Töne sind dieselben.</li><li><b>Nur Tablet oder Handy:</b> Tippe die Tasten der Klaviatur direkt in der App. Ein Instrument ist dann nicht nötig.</li></ul></details>'));
    SONGS.forEach(s=>{const p=progress(s);
      const c=html(`<div class="card song"><div class="sn" style="font-size:32px;background:#eef0ff">${s.em}</div><div style="flex:1;min-width:0"><h3>${s.title}</h3><div class="small muted">${s.meta}</div>
        <div class="row" style="margin-top:8px;gap:10px"><span class="dots5">${Array.from({length:NL(s)},(_,i)=>i+1).map(n=>`<i class="${S.done[s.id+'_'+n]?'on':''}"></i>`).join('')}</span><span class="small muted">${p} von ${NL(s)} Levels</span><span class="tag">Schwierigkeit ${'●'.repeat(s.diff)+'○'.repeat(3-s.diff)}</span></div></div>
        <div class="st"><span style="color:var(--ind)">${p===4?'Geschafft ✓':p?'Weiter ›':'Starten ›'}</span></div></div>`);
      c.onclick=()=>go('song',s.id);m.append(c)});
    const ak=html(`<div class="card song"><div class="sn" style="font-size:32px;background:#eef0ff">🎸</div><div style="flex:1;min-width:0"><h3>Akkordprojekt</h3><div class="small muted">Dreiklänge, Umkehrungen und Lieder begleiten</div></div><div class="st"><span style="color:var(--ind)">Öffnen ›</span></div></div>`);
    ak.onclick=()=>go('akk');m.append(ak);
    const bq=html(`<div class="card song"><div class="sn" style="font-size:32px;background:#eef0ff">🎷</div><div style="flex:1;min-width:0"><h3>Blues-Projekt</h3><div class="small muted">Blues-Akkorde, 12 Takte, Swing, Songs, Blues-Tonleiter und Improvisieren</div></div><div class="st"><span style="color:var(--ind)">Öffnen ›</span></div></div>`);
    bq.onclick=()=>go('blues');m.append(bq);
    const rh=html(`<div class="card lv"><div class="ic">🥁</div><div><h3>Puls und Rhythmus</h3><div class="small muted">Rhythmussprache, Notenwerte, Zufallsrhythmen (4/4 und 3/4)</div></div><div class="st"><span style="color:var(--ind)">Öffnen ›</span></div></div>`);
    rh.onclick=()=>go('rhy');m.append(rh);
    const mp=html(`<div class="card lv"><div class="ic">🎹</div><div><h3>Mini-Piano kennenlernen</h3><div class="small muted">Bedienfeld, Tasten und Tastennamen</div></div><div class="st"><span style="color:var(--ind)">Öffnen ›</span></div></div>`);
    mp.onclick=()=>go('mini');m.append(mp)}
  else if(view==='mini'){$('#ttl').textContent='Mini-Piano';miniPiano(m)}
  else if(view==='akk'){$('#ttl').textContent='Akkordprojekt';akkordProjekt(m)}
  else if(view==='blues'){$('#ttl').textContent='Blues-Projekt';bluesProject(m)}
  else if(view==='rhy'){$('#ttl').textContent='Puls und Rhythmus';rhythmHub(m)}
  else if(view==='song'){$('#ttl').textContent=CUR.title;
    const p=progress(CUR);
    m.append(html(`<div class="card"><div class="row sp"><div><h2>${CUR.title}</h2><p class="muted" style="margin:0">${CUR.meta}</p></div><span class="tag">${p} von ${NL(CUR)} Levels</span></div>
      <p class="small muted" style="margin:10px 0 0">Der Weg: Bausteine &amp; Rhythmus → Ein Ton → Akkordtöne → Zusammen${CUR.mel?' → Melodie':''}. Puls und Notenwerte übst du vorher im Rhythmus-Block.</p></div>`));
    LEVELS.filter(l=>l.n<=NL(CUR)).forEach(l=>{const un=unlocked(l.n),dn=isDone(l.n);
      const c=html(`<div class="card lv ${dn?'done':''} ${un?'':'locked'}"><div class="ic">${dn?'✓':l.ic}</div><div><h3>Level ${l.n} · ${l.t}</h3><div class="small muted">${l.sub()}</div></div><div class="st">${dn?'<span style="color:var(--ok)">Geschafft</span>':un?'<span style="color:var(--ind)">Öffnen ›</span>':'🔒'}</div></div>`);
      c.onclick=()=>{if(un)go(l.n);else toast('Schliesse zuerst Level '+(l.n-1)+' ab.')};m.append(c)})}
  else{const l=LEVELS[view-1];$('#ttl').textContent=CUR.title+' · Level '+l.n;l.f(m)}
}
const backOne=()=>{if(view==='akk'&&AKS){Eng.stop();AKS=null;render();window.scrollTo(0,0)}else if(view==='blues'&&BLT===7&&BLS){Eng.stop();BLS=null;render();window.scrollTo(0,0)}else go(typeof view==='number'?'song':'home')};
$('#back').onclick=backOne;
$('#miniB').onclick=()=>go('mini');
function printSheets(){
  const bpb=CUR.bpb||4,out=[],cols=['#222'];
  const card=(title,voices,bars,evf,systems)=>{const sc=renderScore({bars,systems,flat:CUR.flat,bpb,voices,voiceLabel:true,colorNotes:false,events:evf,words:true});
    const c=document.createElement('div');c.className='card';const h=document.createElement('h3');h.textContent=title+' · '+CUR.title;c.append(h,sc.el);return c};
  const parts=CUR.parts.filter(p=>p.label!=='Beides');
  const hasMelBars=!!CUR.mel;
  [0,1,2].forEach(v=>parts.forEach(P=>out.push({v:String(v+1),t:'Notenblatt: '+(v+1)+'. Stimme · '+P.label,on:v===0,el:card((v+1)+'. Stimme · '+P.label,[{label:'Stimme '+(v+1),color:'#222'}],CUR.bars,(id,vv)=>CUR.bars[id].v[v],P.systems)})));
  parts.forEach(P=>out.push({v:'a',t:'Notenblatt: alle drei Stimmen · '+P.label,on:false,el:card('Alle Stimmen · '+P.label,[0,1,2].map(i=>({label:'Stimme '+(i+1),color:'#222'})),CUR.bars,(id,v)=>CUR.bars[id].v[v],P.systems)}));
  if(hasMelBars)out.push({v:'m',t:'Notenblatt: Melodie',on:false,el:card('Melodie',[{label:'Melodie',color:'#222'}],CUR.mel,(id,v)=>CUR.mel[id].v[0],CUR.systems)});
  return out}
function openPrintDialog(){try{
  document.querySelectorAll('.lesson:not(.open)').forEach(c=>c.querySelector('.lh').click());
  document.querySelectorAll('.card.ex:not(.open)').forEach(c=>c.querySelector('.hd').click());
  const items=[...document.querySelectorAll('#main .card')].filter(c=>!c.parentElement.closest('.card')).map((c,i)=>{
    const h=c.querySelector('h1,h2,h3');return{el:c,t:(h?h.textContent:'Abschnitt '+(i+1)).trim().slice(0,70),on:view!=='song'}});
  if(CUR&&(view==='song'||typeof view==='number')){try{items.unshift(...printSheets())}catch(e){}}
  if(!items.length){toast('Hier gibt es nichts zu drucken.');return}
  $('#prDlg')?.remove();
  const dlg=html('<div id="prDlg" style="position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:10px"><div style="background:#fff;border-radius:16px;max-width:1100px;width:100%;max-height:94vh;display:flex;flex-direction:column;overflow:hidden"><div style="padding:12px 16px;border-bottom:1px solid #e5e7eb;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="flex:1;font-size:18px">Drucken: Auswahl und Vorschau</b><button class="btn sec" data-a="all">Alle</button><button class="btn sec" data-a="none">Keine</button><button class="btn" data-a="go">🖨 Drucken</button><button class="btn" data-a="pdf">📄 Als PDF speichern</button><button class="btn sec" data-a="x">Schliessen</button></div><div class="pvoice" style="padding:8px 16px;border-bottom:1px solid #e5e7eb;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="small muted">Noten für:</span><button class="btn sec" data-v="1">Stimme 1</button><button class="btn sec" data-v="2">Stimme 2</button><button class="btn sec" data-v="3">Stimme 3</button><button class="btn sec" data-v="a">Alle Stimmen</button><button class="btn sec" data-v="m" style="display:none">Melodie</button></div><div style="display:flex;gap:0;flex:1;min-height:0;flex-wrap:wrap"><div class="plist" style="flex:0 0 280px;max-width:100%;overflow:auto;padding:10px 14px;border-right:1px solid #e5e7eb;max-height:40vh"></div><div class="pprev" style="flex:1;min-width:260px;overflow:auto;padding:12px;background:#f3f4f6"></div></div></div></div>');
  document.body.append(dlg);
  const list=$('.plist',dlg),prev=$('.pprev',dlg),boxes=[];
  items.forEach((it,k)=>{const l=document.createElement('label');l.style.cssText='display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=it.on!==false;cb.style.cssText='margin-top:3px;width:18px;height:18px;flex:none';cb.onchange=draw;boxes.push(cb);
    l.append(cb,document.createTextNode(it.t));list.append(l)});
  function sel(){return items.filter((it,k)=>boxes[k].checked)}
  function draw(){prev.innerHTML='';const pg=document.createElement('div');pg.style.cssText='background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2);padding:14px;max-width:720px;margin:0 auto;zoom:.8';
    sel().forEach(it=>{const c=it.el.cloneNode(true);c.classList.add('prc');pg.append(c)});
    if(!pg.children.length)pg.innerHTML='<p style="color:#6b7280">Nichts ausgewählt.</p>';prev.append(pg)}
  draw();
  if(items.some(it=>it.v==='m'))$('[data-v=m]',dlg).style.display='';
  let vName='';
  const doPrint=pdf=>{const ch=sel();if(!ch.length){toast('Bitte etwas auswählen.');return}
    $('#printArea')?.remove();const pa=document.createElement('div');pa.id='printArea';
    ch.forEach(it=>{const c=it.el.cloneNode(true);pa.append(c)});document.body.append(pa);document.body.classList.add('printing');
    const t=document.title;document.title='Piano Levels – '+(CUR&&typeof view!=='undefined'&&view!=='home'&&view!=='mini'?CUR.title:($('#ttl').textContent||''))+(vName?' – '+vName:'');
    const done=()=>{document.body.classList.remove('printing');$('#printArea')?.remove();document.title=t};
    window.addEventListener('afterprint',done,{once:true});
    if(pdf)toast('Im nächsten Fenster «Als PDF sichern» bzw. «Als PDF speichern» wählen.');
    setTimeout(()=>{try{window.print()}catch(e){done()}},pdf?900:150)};
  dlg.onclick=e=>{const v=e.target.dataset&&e.target.dataset.v;
    if(v){const nm={'1':'Stimme 1','2':'Stimme 2','3':'Stimme 3',a:'Alle Stimmen',m:'Melodie'};vName=nm[v];
      items.forEach((it,k)=>{boxes[k].checked=it.v===v});dlg.querySelectorAll('.pvoice [data-v]').forEach(b=>b.style.outline=b.dataset.v===v?'3px solid var(--ind)':'');draw();return}
    const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
    if(a==='x'){dlg.remove()}
    else if(a==='all'||a==='none'){boxes.forEach(b=>b.checked=a==='all');vName='';draw()}
    else if(a==='go'||a==='pdf')doPrint(a==='pdf')};
}catch(e){}}
$('#prB').onclick=openPrintDialog;

$('#volB').onclick=()=>{
  const V=S.vol=S.vol||{m:1,c:1,t:1,v:[1,1,1,1]};if(!V.v)V.v=[1,1,1,1];
  const rows=[['d','Ton verschieben (+ Ton später, – Ton früher als das Bild)'],['m','Gesamt'],['c','Metronom-Klick'],['t','Tipp-Ton (Klopfen)'],['v0','Stimme 1 (z. B. Melodie / rechte Hand)'],['v1','Stimme 2 (z. B. linke Hand / Begleitung)'],['v2','Stimme 3'],['v3','Stimme 4']];
  const get=k=>k[0]==='v'?V.v[+k[1]]:V[k]||0;const isD=k=>k==='d';
  const ov=html(`<div class="ov"><div class="box"><h3>🔊 Lautstärke</h3><p class="small muted">Wirkt sofort, auch während ein Lied läuft. 100 % ist Standard (doppelt so laut wie früher), bis 400 % lauter. Ton verschieben: «+» spielt den Ton später (Bild kommt verspätet an, z. B. bei Cast), «–» früher (Bild läuft dann später mit).</p>${rows.map(r=>`<div style="margin:10px 0"><div class="small">${r[1]}: <b data-v="${r[0]}">${r[0]==='d'?(get('d')>0?'+':'')+Math.round(get('d'))+' ms':Math.round(get(r[0])*100)+' %'}</b></div>${r[0]==='d'?'<div class="small muted" style="margin:2px 0 4px">Richtwert bei Google Cast auf den Google TV Streamer: ca. −600 ms (Lag). Der Wert ist ein Anhaltspunkt, stelle ihn nach Gehör passend ein.</div>':''}<input type="range" min="${r[0]==='d'?-2000:0}" max="${r[0]==='d'?2000:400}" step="${r[0]==='d'?10:5}" value="${r[0]==='d'?Math.round(get('d')):Math.round(get(r[0])*100)}" data-k="${r[0]}" style="width:100%"></div>`).join('')}<div class="row"><button class="btn sec" data-a="t">Test-Klick</button><button class="btn sec" data-a="r">Zurücksetzen</button><button class="btn" data-a="x">Fertig</button></div></div></div>`);
  ov.oninput=e=>{const k=e.target.dataset.k;if(!k)return;const v=k==='d'?+e.target.value:e.target.value/100;if(k[0]==='v')V.v[+k[1]]=v;else V[k]=v;ov.querySelector(`[data-v="${k}"]`).textContent=(k==='d'&&+e.target.value>0?'+':'')+e.target.value+(k==='d'?' ms':' %');Eng.applyVol();save()};
  ov.onclick=e=>{const a=e.target.dataset.a;if(a==='x'||e.target===ov)ov.remove();if(a==='t'){Eng.ensure();const t=Eng.ctx.currentTime+.05;Eng.click(t,true);Eng.click(t+.5,false);Eng.tone(t+1,67,.6,.8,0)}
    if(a==='r'){S.vol={m:1,c:1,t:1,v:[1,1,1,1],d:0};save();Eng.applyVol();ov.remove();$('#volB').onclick()}};
  document.body.append(ov)};
$('#cfgb').onclick=()=>{
  const ov=html(`<div class="ov"><div class="box"><h3>Einstellungen</h3>
   <p class="small muted">Timing-Korrektur für die Tipp-Aufgaben: Wenn du dich immer zu früh oder zu spät bewertet fühlst (z. B. wegen Bluetooth-Kopfhörern).</p>
   <div class="row"><input type="range" min="-150" max="250" step="5" value="${S.latency}"><b class="lv2">${S.latency} ms</b></div>
   <p class="small muted" style="margin-top:14px">Zum Testen:</p><div class="row"><span class="pill ${(S.apr||CONFIG.approval)==='teacher'?'on':''}" data-a="apr">Freigabe durch Lehrperson</span></div>
   <p class="small muted" style="margin-top:14px">Lehrercode (alle Levels öffnen):</p><div class="row"><input type="text" id="tc" autocapitalize="off" placeholder="Code"><button class="btn sec" data-a="t">OK</button></div>
   <div class="row" style="margin-top:16px;justify-content:space-between"><button class="btn bad" data-a="rs">Fortschritt löschen</button><button class="btn" data-a="x">Schliessen</button></div></div></div>`);
  const rg=$('input[type=range]',ov);rg.oninput=()=>{S.latency=+rg.value;$('.lv2',ov).textContent=S.latency+' ms';save()};
  ov.onclick=e=>{const a=e.target.dataset.a;if(e.target===ov||a==='x'){ov.remove();render()}
    if(a==='apr'){S.apr=(S.apr||CONFIG.approval)==='teacher'?'self':'teacher';save();e.target.classList.toggle('on',S.apr==='teacher')}
    if(a==='t'){if($('#tc',ov).value.trim().toLowerCase()===CONFIG.teacher){S.teacher=true;save();toast('Lehrermodus: alle Levels offen.')}else toast('Code falsch.')}
    if(a==='rs'){if(!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent='Sicher? Nochmals tippen'}else{S={done:{},best:{},chk:{},teacher:false,latency:0,apr:S.apr,vol:S.vol};save();ov.remove();go('home')}}};
  document.body.append(ov)};
render();
</script>

/* ===== Zurück-Geste (Handy): ein Schritt zurück statt App schliessen ===== */
(function(){
 let depth=0,ign=0,raf=0;
 const isSub=()=>{try{return !!(view!=='home')}catch(e){return false}};
 const goBack=()=>{try{backOne()}catch(e){}};
 window._navPush=()=>{try{if(!depth&&isSub()){history.pushState({sub:1},'');depth=1}}catch(e){}};
 function sync(){
  raf=0;const want=isSub();
  if(want&&!depth){history.pushState({sub:1},'');depth=1}
  else if(!want&&depth){depth=0;ign++;history.back()}
 }
 const sched=()=>{if(!raf)raf=requestAnimationFrame(sync)};
 new MutationObserver(sched).observe(document.body,{attributes:true,subtree:true,childList:true,attributeFilter:['class','hidden','style']});
 window.addEventListener('popstate',()=>{
  if(ign>0){ign--;return}
  if(depth){depth=0;goBack();sched()}
 });
})();
</script>
